stages:
  - sync
  - build

variables:
  STORAGE_DRIVER: 'vfs'
  BUILDAH_FORMAT: 'docker'
  BUILDAH_ISOLATION: 'chroot'
  UPSTREAM_REPO: 'https://github.com/bilawalsidhu/gods-eye-view.git'
  # GitLab's project-level default git depth grafts history, so `git merge
  # upstream/main` has no reachable merge base and fails with "refusing to
  # merge unrelated histories". Full clone needed for a real merge.
  GIT_DEPTH: '0'
  PUPPETEER_SKIP_DOWNLOAD: 'true'

default:
  tags:
    - docker

sync:upstream:
  stage: sync
  # node:24-alpine, not alpine/git — the verify gate needs npm; alpine/git has none.
  image: node:24-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    # The GitHub fork syncs itself from upstream at 06:00 UTC
    # (.github/workflows/sync-upstream.yml). Merging it first means both
    # remotes share one merge commit instead of two different ones.
    MIRROR_REPO: 'https://github.com/Tuxprogrammer/gods-eye-view.git'
  before_script:
    - apk add --no-cache git curl
  script:
    # Merge logic: scripts/sync-upstream.sh (union-merges Markdown conflicts).
    # Gate: scripts/sync-verify.sh (blocks only failures the merge introduces).
    - |
      notify() {
        curl -sf -X POST -H "Content-Type: application/json" -d "{\"content\":\"gods-eye-view: $1\"}" "$DISCORD_WEBHOOK_URL" || true
      }
      BEFORE_SHA="$(git rev-parse HEAD)"
      set +e
      sh scripts/sync-upstream.sh
      rc=$?
      set -e
      if [ "$rc" -eq 10 ]; then
        notify "upstream sync hit a merge conflict outside Markdown - needs manual resolution."
        exit 1
      elif [ "$rc" -ne 0 ]; then
        notify "upstream sync could not fetch a remote (exit $rc) - check network or a renamed branch."
        exit 1
      fi
      AFTER_SHA="$(git rev-parse HEAD)"
      if [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
        echo "Already up to date - nothing to push, no notification."
        exit 0
      fi
      if ! sh scripts/sync-verify.sh "$BEFORE_SHA" "$AFTER_SHA"; then
        notify "upstream merged cleanly but introduced NEW test/boundary/format failures - NOT pushed to main. Needs manual review."
        exit 1
      fi
      git push "https://sync-bot:${SYNC_PUSH_TOKEN}@git.tuxhpc.net/homelab/gods-eye-view.git" "$AFTER_SHA:refs/heads/main"
      notify "merged upstream, no new failures, pushed to main ($(git rev-list --count "$BEFORE_SHA..$AFTER_SHA") new commits)."

build:image:
  stage: build
  image: quay.io/buildah/stable:v1.39
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - buildah --storage-driver="$STORAGE_DRIVER" login --tls-verify=false --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export IMAGE_SHA="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    # Mirrors log-patrol's exact structure (separate tag+push behind the branch
    # check, not a second -t on `bud`) rather than a superficially-equivalent
    # rewrite — cheaper to match a proven pattern than to find out multi-tag
    # buildah behaves subtly differently.
    - buildah --storage-driver="$STORAGE_DRIVER" bud --pull --layers --isolation="$BUILDAH_ISOLATION" --tls-verify=false
      --build-arg CESIUM_ION_TOKEN="$CESIUM_ION_TOKEN"
      --build-arg GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
      -t "$IMAGE_SHA" -f "$CI_PROJECT_DIR/Dockerfile" "$CI_PROJECT_DIR"
    - buildah --storage-driver="$STORAGE_DRIVER" push --tls-verify=false "$IMAGE_SHA" "docker://$IMAGE_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah --storage-driver="$STORAGE_DRIVER" tag "$IMAGE_SHA" "$CI_REGISTRY_IMAGE:latest"
        buildah --storage-driver="$STORAGE_DRIVER" push --tls-verify=false "$CI_REGISTRY_IMAGE:latest" "docker://$CI_REGISTRY_IMAGE:latest"
      fi
