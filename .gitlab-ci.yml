stages:
  - sync
  - build

variables:
  STORAGE_DRIVER: "vfs"
  BUILDAH_FORMAT: "docker"
  BUILDAH_ISOLATION: "chroot"
  UPSTREAM_REPO: "https://github.com/bilawalsidhu/gods-eye-view.git"
  # GitLab's project-level default git depth grafts history, so `git merge
  # upstream/main` has no reachable merge base and fails with "refusing to
  # merge unrelated histories". Full clone needed for a real merge.
  GIT_DEPTH: "0"
  PUPPETEER_SKIP_DOWNLOAD: "true"

default:
  tags:
    - docker

sync:upstream:
  stage: sync
  # node:24-alpine, not alpine/git — the test gate below needs npm; alpine/git has none.
  image: node:24-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  before_script:
    - apk add --no-cache git curl
  script:
    - git remote set-url upstream "$UPSTREAM_REPO" 2>/dev/null || git remote add upstream "$UPSTREAM_REPO"
    - git fetch upstream main
    - git config user.email "ci@git.tuxhpc.net"
    - git config user.name "gods-eye-view sync bot"
    - BEFORE_SHA="$(git rev-parse HEAD)"
    - |
      if git merge --no-edit upstream/main; then
        AFTER_SHA="$(git rev-parse HEAD)"
        if [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
          echo "Already up to date — nothing to push, no notification."
        elif npm ci && npm test && npm run check:boundaries && npm run format:check; then
          git push "https://sync-bot:${SYNC_PUSH_TOKEN}@git.tuxhpc.net/homelab/gods-eye-view.git" HEAD:main
          curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"content":"gods-eye-view: merged upstream cleanly, tests passed, pushed to main."}' \
            "$DISCORD_WEBHOOK_URL"
        else
          curl -sf -X POST -H "Content-Type: application/json" \
            -d '{"content":"gods-eye-view: upstream merged cleanly but failed tests/boundaries/format checks — NOT pushed to main. Needs manual review."}' \
            "$DISCORD_WEBHOOK_URL"
          exit 1
        fi
      else
        git merge --abort
        curl -sf -X POST -H "Content-Type: application/json" \
          -d '{"content":"gods-eye-view: upstream sync hit a merge conflict — needs manual resolution."}' \
          "$DISCORD_WEBHOOK_URL"
        # STILL A PLACEHOLDER — not fully specified. At minimum needs:
        #  - push the conflicted state to a FIXED branch (e.g. upstream-sync-conflict),
        #    force-updating it each day rather than accumulating branches
        #  - check the GitLab API for an already-open MR from that branch before
        #    creating a new one, so a persistent conflict doesn't spawn one per day
        #  - decide --no-ff vs --ff-only, since that determines whether the fork's
        #    own commits survive an upstream rewrite
      fi
      # NOTE: if `git fetch upstream main` itself fails (network, auth, upstream
      # renamed a branch), the job dies here and NO notification is sent at all —
      # a silent failure mode worth deciding whether to guard against. Same for
      # a test-gate failure above: currently just a red job + Discord alert, no
      # automatic MR — deliberately left simpler than the conflict path rather
      # than doubling the not-yet-built MR logic for a second failure mode.

build:image:
  stage: build
  image: quay.io/buildah/stable:v1.39
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - buildah --storage-driver="$STORAGE_DRIVER" login --tls-verify=false --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export IMAGE_SHA="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    # Mirrors log-patrol's exact structure (separate tag+push behind the branch
    # check, not a second -t on `bud`) rather than a superficially-equivalent
    # rewrite — cheaper to match a proven pattern than to find out multi-tag
    # buildah behaves subtly differently.
    - buildah --storage-driver="$STORAGE_DRIVER" bud --pull --layers --isolation="$BUILDAH_ISOLATION" --tls-verify=false
        --build-arg CESIUM_ION_TOKEN="$CESIUM_ION_TOKEN"
        --build-arg GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY"
        -t "$IMAGE_SHA" -f "$CI_PROJECT_DIR/Dockerfile" "$CI_PROJECT_DIR"
    - buildah --storage-driver="$STORAGE_DRIVER" push --tls-verify=false "$IMAGE_SHA" "docker://$IMAGE_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        buildah --storage-driver="$STORAGE_DRIVER" tag "$IMAGE_SHA" "$CI_REGISTRY_IMAGE:latest"
        buildah --storage-driver="$STORAGE_DRIVER" push --tls-verify=false "$CI_REGISTRY_IMAGE:latest" "docker://$CI_REGISTRY_IMAGE:latest"
      fi
